const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(user,pw){
 const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+':'+pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(D.i)},key,d64(D.c));
 return new TextDecoder().decode(buf)}
